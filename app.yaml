runtime: nodejs20
instance_class: F1

env_variables:
  NODE_ENV: 'production'

handlers:
  - url: /api/.*
    script: auto
    secure: always

  - url: /(.*\.(js|css|svg|png|jpg|jpeg|ico|json))$
    static_files: frontend/dist/\1
    upload: frontend/dist/.*\.(js|css|svg|png|jpg|jpeg|ico|json)$
    secure: always

  - url: /.*
    static_files: frontend/dist/index.html
    upload: frontend/dist/index.html
    secure: always
